name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify stats token
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "::error::GH_STATS_TOKEN is not configured; add a PAT that can read all repositories included in the profile stats."
            exit 1
          fi

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&include_all_commits=true&count_private=true&title_color=e6edf3&text_color=8b949e&icon_color=8b949e&hide_title=true&hide_rank=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&include_all_commits=true&count_private=true&title_color=24292f&text_color=57606a&icon_color=57606a&hide_title=true&hide_rank=true
          path: profile/stats-light.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent&hide_border=true&title_color=e6edf3&text_color=8b949e
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=transparent&hide_border=true&title_color=24292f&text_color=57606a
          path: profile/top-langs-light.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Verify generated cards
        run: |
          minimum_size=1000
          for svg in profile/*.svg; do
            if [ ! -f "$svg" ]; then
              echo "::error::No generated SVG cards found under profile/."
              exit 1
            fi

            size=$(wc -c < "$svg")
            if [ "$size" -lt "$minimum_size" ]; then
              echo "::error file=$svg::Generated SVG is implausibly small ($size bytes)."
              exit 1
            fi

            if grep -Eq 'Something went wrong|data-testid="message"' "$svg"; then
              echo "::error file=$svg::Generated SVG contains an error-card signature."
              exit 1
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "Meta-Develop"
          git config user.email "Meta-Develop@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
